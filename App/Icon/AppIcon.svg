<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Concept 4: Branch. One tile forks along a path into two tiles. -->
  <defs>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <linearGradient id="bg" x1="100" y1="100" x2="924" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22C7B2"/>
      <stop offset="1" stop-color="#0A6E7C"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="200" x2="0" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#EFE3CC"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <g transform="translate(0 20)" opacity="0.30">
      <path d="M512 680 C512 548 292 552 292 380" fill="none" stroke="#043E48" stroke-width="80" stroke-linecap="round"/>
      <path d="M512 680 C512 548 732 552 732 380" fill="none" stroke="#043E48" stroke-width="80" stroke-linecap="round"/>
      <rect x="176" y="200" width="232" height="232" rx="62" fill="#043E48"/>
      <rect x="616" y="200" width="232" height="232" rx="62" fill="#043E48"/>
      <rect x="396" y="628" width="232" height="232" rx="62" fill="#043E48"/>
    </g>
    <path d="M512 680 C512 548 292 552 292 380" fill="none" stroke="url(#cream)" stroke-width="80" stroke-linecap="round"/>
    <path d="M512 680 C512 548 732 552 732 380" fill="none" stroke="url(#cream)" stroke-width="80" stroke-linecap="round"/>
    <rect x="176" y="200" width="232" height="232" rx="62" fill="url(#cream)"/>
    <rect x="616" y="200" width="232" height="232" rx="62" fill="url(#cream)"/>
    <rect x="396" y="628" width="232" height="232" rx="62" fill="url(#cream)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="url(#rim)" stroke-width="8"/>
  </g>
</svg>
