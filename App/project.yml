name: MacAppDuplicator
options:
  bundleIdPrefix: com.mikekuta
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "27.0"

packages:
  DuplicatorCore:
    path: ..

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    DEAD_CODE_STRIPPING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  MacAppDuplicator:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
      # The bundled compatibility profiles seed (spec §8), copied into Contents/Resources.
      - path: ../Packages/CompatProfiles/Resources/profiles.json
        buildPhase: resources
    dependencies:
      - package: DuplicatorCore
        product: DuplicatorCore
      - package: DuplicatorCore
        product: CompatProfiles
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikekuta.MacAppDuplicator
        PRODUCT_NAME: "macOS App Duplicator"
        PRODUCT_MODULE_NAME: MacAppDuplicator
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "macOS App Duplicator"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Cubbieblue16"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSMainStoryboardFile: ""
        CURRENT_PROJECT_VERSION: "2"
        MARKETING_VERSION: "0.3.0"
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: "App Duplicator"
        CFBundleDisplayName: "macOS App Duplicator"
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    postBuildScripts:
      - name: Embed Launcher
        shell: /bin/bash
        # Runs on every build so the Launcher build below always runs; Xcode would otherwise skip this phase while the
        # old Launcher binary is newer than the embedded copy (final review M20).
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(SRCROOT)/../.build/release/Launcher"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Launcher"
        script: |
          set -euo pipefail
          LAUNCHER_SRC="${SRCROOT}/../.build/release/Launcher"
          # Always build: SwiftPM is incremental, and a build started from Xcode must not embed a stale Launcher.
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin xcrun swift build -c release --product Launcher --package-path "${SRCROOT}/.."
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Launcher"
          mkdir -p "$(dirname "$DEST")"
          cp -f "$LAUNCHER_SRC" "$DEST"
          chmod 755 "$DEST"
          if [ "${EXPANDED_CODE_SIGN_IDENTITY:--}" = "-" ] || [ -z "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --sign - "$DEST"
          else
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime --timestamp "$DEST"
          fi
      - name: Embed WebShell
        shell: /bin/bash
        # Same shape as Embed Launcher: runs on every build so the WebShell build below always runs and a stale
        # binary is never embedded.
        basedOnDependencyAnalysis: false
        inputFiles:
          - "$(SRCROOT)/../.build/release/WebShell"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/WebShell"
        script: |
          set -euo pipefail
          WEBSHELL_SRC="${SRCROOT}/../.build/release/WebShell"
          # Always build: SwiftPM is incremental, and a build started from Xcode must not embed a stale WebShell.
          env -i HOME="$HOME" PATH=/usr/bin:/bin:/usr/sbin:/sbin xcrun swift build -c release --product WebShell --package-path "${SRCROOT}/.."
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/WebShell"
          mkdir -p "$(dirname "$DEST")"
          cp -f "$WEBSHELL_SRC" "$DEST"
          chmod 755 "$DEST"
          if [ "${EXPANDED_CODE_SIGN_IDENTITY:--}" = "-" ] || [ -z "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --sign - "$DEST"
          else
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --options runtime --timestamp "$DEST"
          fi

  MacAppDuplicatorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: MacAppDuplicator
      - package: DuplicatorCore
        product: DuplicatorCore
      - package: DuplicatorCore
        product: CompatProfiles
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mikekuta.MacAppDuplicatorTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/macOS App Duplicator.app/Contents/MacOS/macOS App Duplicator"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  MacAppDuplicator:
    build:
      targets:
        MacAppDuplicator: all
        MacAppDuplicatorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MacAppDuplicatorTests
